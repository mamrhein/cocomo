[package]
name = "cocomo-tui"
version = "0.0.1"
edition = "2024"
description = "TUI-App: COmpare, COpy & MOve directories and files."
documentation = "https://docs.rs/cocomo-tui/"
readme = "../README.md"
homepage = "https://github.com/mamrhein/cocomo"
repository = "https://github.com/mamrhein/cocomo"
license-file = "../LICENSE.TXT"
keywords = ["compare", "copy", "directory", "file", "move"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "cocomo-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cocomo-lib = { path = "../cocomo-lib" }
dirs = "7"
fs-err = { version = "3", features = ["tokio"] }
ratatui-kit = { version = "0.12", features = ["full"] }
tokio = {
  version = "1",
  features = [
    "macros",
    "rt-multi-thread",
  ]
}
thiserror = "2"

[dev-dependencies]
tempfile = "3"

# ---------------------------------------------------------------------------
# cocomo_gui — Desktop GUI for directory comparison
# ---------------------------------------------------------------------------

[package]
name = "cocomo-gui"
description = "GUI-App: COmpare, COpy & MOve directories and files."
version.workspace = true
edition.workspace = true
readme.workspace = true
repository.workspace = true
license-file.workspace = true
keywords.workspace = true
categories = ["filesystem", "gui"]

# `cargo bundle` (cargo-bundle) macOS/.app metadata; the icon is the
# icns derived from resources/icons/app-icon.svg.
[package.metadata.bundle]
name = "cocomo"
identifier = "de.adrhinum.cocomo"
icon = ["resources/icons/app-icon.icns"]
short_description = "COmpare, COpy & MOve directories and files."
category = "public.app-category.utilities"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
cocomo-lib.workspace = true
dirs.workspace = true
fs-err.workspace = true
gpui = {
    package = "gpui-kit",
    version = "0.9",
    features = [
        "tree-sitter",
        "tree-sitter-rust",
        "tree-sitter-python",
        "tree-sitter-c",
    ],
}
image = {
    version = "0.25",
    default-features = false,
    features = ["png", "jpeg", "gif", "webp", "bmp"],
}
log = "0.4"
regex.workspace = true
rust-embed = { version = "8.13", features = ["include-exclude"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
gpui = { package = "gpui-kit", version = "0.9", features = ["test-support"] }
tempfile.workspace = true

# ---------------------------------------------------------------------------
# cocomo_gui — Desktop GUI for directory comparison
# ---------------------------------------------------------------------------

[package]
name = "cocomo-gui"
version = "0.0.1"
edition = "2024"
description = "GUI-App: COmpare, COpy & MOve directories and files."
documentation = "https://docs.rs/cocomo-gui/"
readme = "../README.md"
homepage = "https://github.com/mamrhein/cocomo"
repository = "https://github.com/mamrhein/cocomo"
license-file = "../LICENSE.TXT"
keywords = ["compare", "copy", "directory", "file", "move"]
categories = ["filesystem", "gui"]

# `cargo bundle` (cargo-bundle) macOS/.app metadata; the icon is the
# icns derived from resources/icons/app-icon.svg.
[package.metadata.bundle]
name = "cocomo"
identifier = "de.adrhinum.cocomo"
icon = ["resources/icons/app-icon.icns"]
short_description = "COmpare, COpy & MOve directories and files."
category = "public.app-category.utilities"

[[bin]]
name = "cocomo-gui"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cocomo-lib = { path = "../cocomo-lib" }
dirs = "7"
fs-err = { version = "3", features = ["tokio"] }
gpui = {
    package = "gpui-kit",
    version = "0.8",
    features = [
        "tree-sitter",
        "tree-sitter-rust",
        "tree-sitter-python",
        "tree-sitter-c",
    ],
}
image = {
    version = "0.25",
    default-features = false,
    features = ["png", "jpeg", "gif", "webp", "bmp"],
}
log = "0.4"
regex = {
  version = "1",
  default-features = false,
  features = [
    "perf",
    "std",
    "unicode-perl",
  ]
}
rust-embed = { version = "8.13", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
gpui = { package = "gpui-kit", version = "0.8", features = ["test-support"] }
tempfile = "3"

[package]
name = "cocomo-lib"
version = "0.0.1"
edition = "2024"
description = "COmpare, COpy & MOve directories and files [core library]."
documentation = "https://docs.rs/cocomo-lib/"
readme = "../README.md"
homepage = "https://github.com/mamrhein/cocomo"
repository = "https://github.com/mamrhein/cocomo"
license-file = "../LICENSE.TXT"
keywords = ["compare", "copy", "directory", "file", "move"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
async_ftp = "6.0.0"
async-trait = "0.1"
base64 = "0.22"
bitflags = "2"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
diff = "0.1"
dirs = "6"
fs-err = { version = "3", features = ["tokio"] }
futures = "0.3"
getrandom = "0.4"
globset = "0.4"
hex = "0.4"
hmac = "0.13"
parking_lot = "0.12"
regex = {
  version = "1",
  default-features = false,
  features = [
    "perf",
    "std",
    "unicode-perl",
  ]
}
rpassword = { version = "7.5", optional = true }
russh = "0.63.3"
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = {
  version = "1",
  features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
  ]
}
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"

[features]
default = ["keychain", "prompt"]
# Credential lookup from the macOS keychain via `/usr/bin/security`.
keychain = []
# Interactive one-time credential prompts on a TTY via `rpassword`.
prompt = ["dep:rpassword"]

[package]
name = "cocomo-lib"
description = "COmpare, COpy & MOve directories and files [core library]."
version.workspace = true
edition.workspace = true
readme.workspace = true
repository.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["keychain", "prompt"]
# Credential lookup from the macOS keychain via `/usr/bin/security`.
keychain = []
# Interactive one-time credential prompts on a TTY via `rpassword`.
prompt = ["dep:rpassword"]

[dependencies]
async_ftp = "6.0.0"
async-trait = "0.1"
base64 = "0.23"
bitflags = "2"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.11"
chrono.workspace = true
diff = "0.1"
dirs.workspace = true
fs-err.workspace = true
futures = "0.3"
getrandom = "0.4"
globset.workspace = true
hex = "0.4"
hmac = "0.13"
parking_lot = "0.13"
regex.workspace = true
rpassword = { version = "7.5", optional = true }
russh = "0.65"
russh-sftp = "3.0.1"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
temp-env = "0.3"
tempfile.workspace = true

[target."cfg(unix)".dependencies]
xattr = "1.7.0"

[workspace]
members = ["cocomo-cli", "cocomo-gui", "cocomo-lib", "cocomo-tui"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
readme = "README.md"
repository = "https://github.com/mamrhein/cocomo"
license-file = "LICENSE.TXT"
keywords = ["compare", "copy", "directory", "file", "move"]
categories = ["command-line-utilities", "filesystem"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cocomo-lib = { path = "cocomo-lib" }
dirs = "7"
fs-err = { version = "3", features = ["tokio"] }
globset = "0.4"
regex = { version = "1", default-features = false, features = [
  "perf",
  "std",
  "unicode-perl",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
] }
